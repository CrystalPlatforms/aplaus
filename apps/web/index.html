<!doctype html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Aplaus</title>
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=ADLaM+Display&display=swap"
			rel="stylesheet"
		/>
		<style>
			/* Kill the browser's default 8px body margin before Tailwind loads —
			   otherwise the splash shows a white frame around the page edges. */
			html,
			body {
				margin: 0;
			}
			/* Static splash: the very first thing on screen, while the JS bundle
			   loads. React replaces it on mount. */
			#root .boot-splash {
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
				background: #ffffff;
				color: #171717;
			}
			@media (prefers-color-scheme: dark) {
				#root .boot-splash {
					background: #000000;
					color: #f5f5f5;
				}
			}
			.boot-splash .boot-title {
				font-family: "ADLaM Display", system-ui, sans-serif;
				font-size: 36px;
				font-weight: 700;
				letter-spacing: -0.02em;
			}
			.boot-splash .boot-loader {
				position: relative;
				height: 40px;
				width: 40px;
				animation: boot-smooth-rotate 1.8s linear infinite;
			}
			.boot-splash .boot-dot {
				position: absolute;
				top: 0;
				left: 0;
				display: flex;
				align-items: flex-start;
				justify-content: center;
				height: 100%;
				width: 100%;
				animation: boot-rotate 1s ease-in-out infinite;
			}
			.boot-splash .boot-dot::before {
				content: "";
				height: 6.8px;
				width: 6.8px;
				border-radius: 50%;
				background: #171717;
			}
			@media (prefers-color-scheme: dark) {
				.boot-splash .boot-dot::before {
					background: #f5f5f5;
				}
			}
			.boot-splash .boot-dot:nth-child(2) {
				animation-delay: -0.417s;
			}
			.boot-splash .boot-dot:nth-child(3) {
				animation-delay: -0.334s;
			}
			.boot-splash .boot-dot:nth-child(4) {
				animation-delay: -0.251s;
			}
			.boot-splash .boot-dot:nth-child(5) {
				animation-delay: -0.167s;
			}
			.boot-splash .boot-dot:nth-child(6) {
				animation-delay: -0.084s;
			}
			@keyframes boot-rotate {
				0% {
					transform: rotate(0deg);
				}
				65%,
				100% {
					transform: rotate(360deg);
				}
			}
			@keyframes boot-smooth-rotate {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.boot-splash .boot-loader,
				.boot-splash .boot-dot {
					animation: none;
				}
				.boot-splash .boot-dot:nth-child(1) {
					transform: rotate(0deg);
				}
				.boot-splash .boot-dot:nth-child(2) {
					transform: rotate(60deg);
				}
				.boot-splash .boot-dot:nth-child(3) {
					transform: rotate(120deg);
				}
				.boot-splash .boot-dot:nth-child(4) {
					transform: rotate(180deg);
				}
				.boot-splash .boot-dot:nth-child(5) {
					transform: rotate(240deg);
				}
				.boot-splash .boot-dot:nth-child(6) {
					transform: rotate(300deg);
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<div class="boot-splash" aria-busy="true">
				<div class="boot-loader">
<div class="boot-dot"></div>
<div class="boot-dot"></div>
<div class="boot-dot"></div>
<div class="boot-dot"></div>
<div class="boot-dot"></div>
<div class="boot-dot"></div>
</div>
				<div class="boot-title">Aplaus</div>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
